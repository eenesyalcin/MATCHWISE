<div class="body">
    <div class="overlay"></div>
    <div class="box">
        <div class="container">
            <div class="top-header">
                <header>Giriş</header>
            </div>
            <div class="input-field">
                <i class='bx bxs-envelope'></i>
                <input #txtEmail type="text" class="input" placeholder="Email">
            </div>
            <div class="input-field">
                <i class='bx bxs-lock-alt'></i>
                <input #txtPassword type="password" class="input" placeholder="Şifre">
            </div>
            <div class="input-field">
                <input type="button" class="submit" value="Giriş"
                (click)="login(txtEmail.value, txtPassword.value)">
            </div>
            <div class="sign-in">
                <span>Hesabınız yok mu? <a routerLink="/bireysel-kayit">Kayıt Ol</a></span>
            </div>
        </div>
    </div>
</div>
