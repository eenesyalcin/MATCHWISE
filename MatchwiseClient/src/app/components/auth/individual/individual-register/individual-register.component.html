<div class="body">
    <div class="overlay"></div>
    <div class="box">
        <div class="container">
            <div class="top-header">
                <header>Kayıt Ol</header>
            </div>
            <div class="input-field">
                <i class='bx bxs-detail'></i>
                <input type="text" class="input" placeholder="Ad" #txtFirstName autocomplete="off" required>
            </div>
            <div class="input-field">
                <i class='bx bxs-detail'></i>
                <input type="text" class="input" placeholder="Soyad" #txtLastName autocomplete="off" required>
            </div>
            <div class="input-field">
                <i class='bx bxs-detail'></i>
                <input type="text" class="input" placeholder="Meslek" #txtJobTitle autocomplete="off">
            </div>
            <div class="input-field">
                <i class='bx bxs-envelope'></i>
                <input type="text" class="input" placeholder="Email" #txtEmail autocomplete="off" required>
            </div>
            <div class="input-field">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" class="input" placeholder="Şifre" #txtPassword autocomplete="off" required>
            </div>
            <div class="input-field">
                <input type="button" class="submit" value="Kayıt Ol"
                (click)="create(txtFirstName, txtLastName, txtJobTitle, txtEmail, txtPassword)">
            </div>
            <div class="sign-in">
                <span>Hesabınız var mı? <a routerLink="/bireysel-giris">Giriş</a></span>
            </div> 
        </div>
    </div>
</div>
