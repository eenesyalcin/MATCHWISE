<div class="overlay">
    <div class="modal-card">
        <div class="modal-header">
            <i class="bx bxs-message-alt-error modal-icon"></i>
            <h3 class="modal-title">SİL</h3>
        </div>
        <p class="modal-message">{{ message }}</p>
        <div class="actions">
            <button class="btn btn-confirm" (click)="confirm.emit()">Sil</button>
            <button class="btn btn-cancel" (click)="cancel.emit()">Vazgeç</button>
        </div>
    </div>
</div>
